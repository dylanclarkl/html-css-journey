<!-- Declares the document type as HTML5 -->
<!DOCTYPE html>

<!-- Sets the language of the document to English -->
<html lang="en">

<head>
    <!-- Sets the character encoding for the document -->
    <meta charset="UTF-8">
    
    <!-- Configures the viewport for responsive web design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Sets the title of the webpage displayed on the browser tab -->
    <title>First Website</title>
</head>

<body>
    <!-- Main heading of the page -->
    <h1>Hello, World!</h1>
    
    <!-- Horizontal rule line -->
    <hr>
    
    <!-- Paragraph describing the page contents -->
    <p>This was the first website I created, containing a title, a horizontal line, and a paragraph.</p>
</body>

</html>
